# Herdr plugins we run, in install order.
#
# `install.sh` reads this file and runs `herdr plugin install <source> [--ref]`
# for every entry that is not already installed. Keep it authoritative: if a
# plugin is not in this list, it is not part of the Yellowstone setup.
#
# Install syntax (herdr >= 0.9):
#   herdr plugin install <owner>/<repo>[/subdir...] [--ref REF] [--yes]
#   herdr plugin link <path>          # local plugin, no copy

# --- voice input --------------------------------------------------------------
# Local speech-to-text: press a key, talk, and the words are typed into the focused
# pane a sentence at a time. Needs Rust >= 1.88 at install time for its build, and a
# microphone the host can reach (Linux only). Three binds, all added to config.toml
# because the manifest ships no keys.
[[plugin]]
id        = "abhishekrana.dictate"
source    = "abhishekrana/herdr-dictate"
ref       = "5bb42cad719c8bec618e84d1f4e83dd74a940561"
why       = "speak into any pane; local STT, useful when typing is the bottleneck"
keybind   = "prefix+v -> abhishekrana.dictate.toggle, prefix+shift+v -> abhishekrana.dictate.toggle-send, prefix+alt+v -> abhishekrana.dictate.toggle-chunking"
requires  = "rust >= 1.88 to build; a microphone; Linux"

# --- realtime voice -----------------------------------------------------------
# The conversational counterpart to dictate: instead of transcribing into the
# focused pane, it opens a realtime voice session (Grok, OpenAI or Gemini) that
# drives the Claude Code / Codex panes, with a floating orb for state. Local
# plugin: a Swift/SwiftPM build from a checkout, so it links rather than installs.
[[plugin]]
id        = "brogrammermw.herdr-voice"
source    = "local"
repo      = "Apothic-AI/herdr-voice-linux"
link_path = "~/Code/herdr-voice-linux"
why       = "talk to the agents instead of typing: realtime voice into the focused pane"
keybind   = "prefix+m -> brogrammermw.herdr-voice.start"
requires  = "swift toolchain to build (`swift build -c release`); a microphone"

# --- the command bar ----------------------------------------------------------
# Fuzzy "go anywhere" switcher: Cmd+K / prefix+k, matching tasks, tabs, panes,
# agents, repos and branches. Also titles unnamed tabs from the agent's task
# title and draws per-agent icons. Keybind is prefix+k in config.toml; the
# plugin manifest ships no keys, so the bind is ours to keep.
[[plugin]]
id        = "herdr-bar"
source    = "jeffarese/herdr-bar"
ref       = "1ec84901d7922987b4273e4ae98c33bd5d251fab"
why       = "one keypress to jump to any tab, pane, agent, repo or branch"
keybind   = "prefix+k -> herdr-bar.open"

# --- plugin management --------------------------------------------------------
# A popup over the `herdr plugin` CLI: install, update, remove, enable/disable and
# browse the marketplace without remembering the CLI. Pair it with herdr-bar:
# the bar is a keypress away for navigation, the manager for the plugin surface
# itself. Because this exists, this manifest is the *declared* set and the popup
# is the interactive surface — installing a plugin by hand is no longer the
# expected path, and an install made through the popup must be reflected here or
# a fresh machine will not have it.
[[plugin]]
id        = "ray.plugin-manager"
source    = "speardragon/herdr-plugin-manager"
ref       = "8ed222ab7efe735b3ef5e037e7ee81d6d7650e4e"
why       = "install, update and browse plugins from a popup instead of the CLI"
keybind   = "prefix+p -> ray.plugin-manager.open"
note      = "the manager is a discovery surface, not a source of truth: this manifest is"

# --- orchestration graph -----------------------------------------------------
# Live DAG of an agent swarm in a split pane. Renders `.dagr/run.json`; the
# `dagr` binary comes from this plugin (bin/dagr) and is symlinked onto PATH.
[[plugin]]
id        = "herdr-dagr"
source    = "aemrebarut/herdr-dagr"
ref       = "52991f9a95a2b8c11518ed66f9530d938c1ba254"
why       = "dagr view pane + bin/dagr, the validator used by the dagr-producer skill"
keybind   = "prefix+d -> herdr-dagr.open-dagr"

# --- work graph beside the pane ----------------------------------------------
# `bdi` in a split: the trees of work in the focused pane's project, with what
# each agent is doing beside its bead. It reads the same beads database the
# `beads` skill uses, so a project tracked in bd gets a live view without a dagr
# run — the dagr pane is for orchestrated runs, this one is for beads work.
[[plugin]]
id        = "codeforbreakfast.beady-eye"
source    = "CodeForBreakfast/beady-eye"
ref       = "6d92fa7bef1d91cb29b5352ce4fb00f7c0313a7b"
why       = "see a project's bead trees and which agent is working each one"
keybind   = "prefix+i -> codeforbreakfast.beady-eye.open"
requires  = "a beads database (bd) for the project it is pointed at"
note      = "herdr/fetch.sh pulls the bdi binary during install"

# --- the human-in-the-loop queue --------------------------------------------
# One queue for everything agents need from a human. Local plugin: point this at
# a checkout of Apothic-AI/unblock (upstream: aneym/unblock) and it links.
[[plugin]]
id        = "unblock"
source    = "local"
repo      = "Apothic-AI/unblock"
upstream  = "aneym/unblock"
link_path = "~/Code/apothic-monorepo-workspace/tooling/unblock"
why       = "structured ask queue: blockers, decisions, consent, spend, messages"
keybind   = "prefix+u -> unblock.open"

# --- sidebar: Jujutsu state --------------------------------------------------
# Feeds the $jj_bookmark / $jj_status sidebar rows in config.toml.
[[plugin]]
id        = "mroth.jj-status"
source    = "mroth/herdr-jj-status"
ref       = "40588ef743e1dd6a252b2e39765616584fd2e39e"
why       = "jj bookmark + working-copy state in the spaces sidebar"
requires  = "jj on PATH (only needed for jj repos)"

# --- sidebar: per-tab project context ---------------------------------------
[[plugin]]
id        = "herdr-context"
source    = "Anthodev/herdr-context"
ref       = "ae16360c212926962b0476764c86aa9b0fd2f0ff"
why       = "per-tab project context dock next to the terminal"
build     = "cargo build --release --locked (plugin build step)"

# --- session handoff between agents -----------------------------------------
[[plugin]]
id        = "wilbeibi.catchup"
source    = "wilbeibi/herdr-catchup"
ref       = "da82ca7ec300b0b4fb5ebf73dedc9e63b77c78ec"
why       = "summarize / fork / hand a pane's session to another agent"

# --- parking and recovery -----------------------------------------------------
# Two different answers to "too many live agents". Stash is deliberate parking:
# record a workspace's layout and its agents' conversations, stop the processes,
# restore later from a popup. Resurrect is recovery: snapshot the herd and bring
# it back after a crash or reboot, when nobody got to park anything.
[[plugin]]
id        = "vsh.stash"
source    = "victor-software-house/herdr-stash"
ref       = "5618e89585cd92fef9215cc5630cce67dfb9c23b"
why       = "park a whole workspace (agents, layout, conversations) and restore it later"
keybind   = "prefix+s -> vsh.stash.open, prefix+shift+s -> vsh.stash.stash"

[[plugin]]
id        = "ntindle.herdr-resurrect"
source    = "ntindle/herdr-resurrect"
ref       = "109a9376549e29646c77fdfb7ed8ba456a9d6617"
why       = "bring the whole herd (spaces, tabs, panes, agents) back after a crash or reboot"
note      = "no keybind: its save/restore actions run from the command palette"

# --- themes ------------------------------------------------------------------
[[plugin]]
id        = "herdr-theme-picker"
source    = "qintmb/herdr-theme-picker"
ref       = "847f7c88aaa2ae82d4945fce7dc89a4175a0543d"
why       = "pick any terminalcolors.com theme; writes [theme.custom]"
note       = "the keybind moved to prefix+t in the plugin manifest; our config.toml does not rebind it"

# --- jj workspace switcher ---------------------------------------------------
# The plugin lives in a subdirectory of the jj-waltz repo. Optional: it is a
# workspace switcher first and a Herdr plugin second.
[[plugin]]
id        = "ezracerpac.jj-waltz"
source    = "EzraCerpac/jj-waltz/plugins/herdr"
ref       = "cd7bb1eb6451b09c06853b0347f856b4203f7c89"
why       = "jj workspace switching bound into Herdr"
optional  = true

# --- deliberately excluded: the pi-rooms popup -------------------------------
# Not a plugin entry on purpose, and the reason is recorded here rather than in
# someone's memory. The running popup is link-installed from
# ~/Code/pi-rooms/.worktrees/c2/plugin, on branch task/c2 @ 856a8fb, and that
# branch exists on no remote. Two of the three honest options are wrong:
#
#   - declaring it at `task/c2` records a ref nobody can fetch, so the file
#     would look authoritative and install nothing on a fresh machine;
#   - declaring it as `source = "local"` with a worktree path records a path
#     into another lane's scratch tree, which is the scatter this monorepo is
#     retiring.
#
# So it is excluded deliberately, and it is the only unpublished surface in the
# fleet. The condition for adding it is not ours to meet: pi-rooms must land
# task/c2 on a remote branch. When it does, add a normal [[plugin]] entry with
# that branch's ref and a link_path under src/herdr-plugins/, and delete this
# section in the same commit.
