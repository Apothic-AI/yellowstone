onboarding = false
[theme]
# `name` is only the base theme: every rendered colour below comes from
# [theme.custom], which herdr-theme-picker writes and never touches `name`.
# So this says tokyo-night while displaying a palette derived from
# pi-neon-afterglow (verified by running the plugin's own map.sh). Changing
# `name` alone changes almost nothing visible; edit or clear [theme.custom] too.
name = "tokyo-night"
auto_switch = false

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$jj_bookmark", "$jj_status"]]

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "herdr-dagr.open-dagr"
description = "open dagr run DAG in split"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "unblock.open"
description = "open unblock queue"

# command bar: jump to any tab, pane, agent, repo or branch
[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

# plugin manager: install, update, browse plugins from a popup
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"


[theme.custom]
panel_bg = "#06040f"
sidebar_bg = "#05030c"
active_row_bg = "#26104d"
selection_bg = "#26104d"
surface0 = "#26104d"
surface1 = "#473a72"
surface_dim = "#05030d"
overlay0 = "#473a72"
overlay1 = "#8a7fb5"
text = "#fff7ff"
subtext0 = "#8a7fb5"
accent = "#00eaff"
mauve = "#ff00cc"
green = "#ccff00"
yellow = "#ffb000"
red = "#ff174f"
blue = "#00eaff"
teal = "#00eaff"
peach = "#ffb000"

# Added by abhishekrana.dictate setup.
# dictate: speak into the focused pane (local STT; Linux + a microphone)
[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "abhishekrana.dictate.toggle"
description = "dictate: toggle"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "abhishekrana.dictate.toggle-send"
description = "dictate: toggle and submit"

[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "abhishekrana.dictate.toggle-chunking"
description = "dictate: toggle live typing"

# herdr-voice: start the voice in a split pane below the focused pane
# The orb shows its state; right-click it for Show voice pane, models and Quit.
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "brogrammermw.herdr-voice.start"
description = "start herdr-voice"

# stash: park this workspace (agents, layout, conversations) and restore it later
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "vsh.stash.open"
description = "stash: the stash picker"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "vsh.stash.stash"
description = "stash: stop this workspace and keep it"

# beady-eye: the bead trees of the focused pane's project, in a split beside it
[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "codeforbreakfast.beady-eye.open"
description = "beady-eye: trees of work beside the pane"
