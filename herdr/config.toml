onboarding = false
[theme]
name = "tokyo-night"
auto_switch = false

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$jj_bookmark", "$jj_status"]]

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "herdr-dagr.open-dagr"
description = "open dagr run DAG in split"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "unblock.open"
description = "open unblock queue"


[theme.custom]
panel_bg = "#06040f"
sidebar_bg = "#05030c"
active_row_bg = "#26104d"
selection_bg = "#26104d"
surface0 = "#26104d"
surface1 = "#473a72"
surface_dim = "#05030d"
overlay0 = "#473a72"
overlay1 = "#8a7fb5"
text = "#fff7ff"
subtext0 = "#8a7fb5"
accent = "#00eaff"
mauve = "#ff00cc"
green = "#ccff00"
yellow = "#ffb000"
red = "#ff174f"
blue = "#00eaff"
teal = "#00eaff"
peach = "#ffb000"
